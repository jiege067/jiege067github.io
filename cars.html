<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8005a">
<title>全车图鉴</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="catalog.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" href="event.html" aria-label="返回">‹</a>
    <h1>全车图鉴</h1>
    <span class="toplink" id="totalTag"></span>
  </header>

  <div class="cat-tools">
    <div class="cat-row">
      <input id="q" class="search" type="search" placeholder="搜索车名 / 别名…" autocomplete="off">
      <select id="sort" class="sortsel">
        <option value="score">按总分</option>
        <option value="top">按极速</option>
        <option value="accel">按加速</option>
        <option value="handling">按操控</option>
        <option value="name">按名称</option>
      </select>
    </div>
    <div class="chips" id="clsChips"></div>
    <div class="chips" id="starChips"></div>
  </div>

  <div class="cat-count" id="count"></div>
  <div id="list" class="cat-list"></div>
</div>

<script src="cars.js"></script>
<script src="catalog.js"></script>
<script src="shell-bridge.js"></script>
</body>
</html>
