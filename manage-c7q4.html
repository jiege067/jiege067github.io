<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F20D3A">
<title>特赛数据管理</title>
<link rel="stylesheet" href="manage.css">
</head>
<body>
<div class="app">
  <header class="m-head">
    <h1>特赛数据管理</h1>
    <button class="reuse" id="reuse" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13.6 1.8v3.6h-3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      复用上期
    </button>
  </header>

  <div id="stages" class="stages"></div>

  <section class="stage ms-card">
    <div class="stage-head">
      <div class="stage-title">里程碑奖励</div>
      <span class="ms-hint">按累计条件发</span>
    </div>
    <div class="stage-rows" id="msList"></div>
    <div class="stage-foot">
      <button class="add-star" id="addMs" type="button">＋ 添加里程碑</button>
    </div>
  </section>

  <div class="add-stage-wrap">
    <button class="add-stage" id="addStage" type="button">＋ 增加下一阶段</button>
  </div>

  <div class="save-bar">
    <button class="save ghost-save" id="export" type="button">导出数据</button>
    <button class="save" id="save" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h8l2 2v9H3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.5 2.5v4h5v-4M5.5 13.5v-3.5h5v3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      保存全部数据
    </button>
  </div>
</div>

<!-- 车辆选择 -->
<div class="sheet" id="carSheet" hidden>
  <div class="mask" data-close="car"></div>
  <div class="panel">
    <div class="panel-head"><b>选择车辆</b><button class="x" data-close="car" type="button">✕</button></div>
    <input class="car-search" id="carSearch" type="search" placeholder="搜索车名 / 别名" autocomplete="off">
    <div class="car-count" id="carCount"></div>
    <div class="car-list" id="carList"></div>
  </div>
</div>

<!-- 奖励编辑 -->
<div class="sheet" id="rwSheet" hidden>
  <div class="mask" data-close="rw"></div>
  <div class="panel">
    <div class="panel-head"><b>奖励</b><button class="x" data-close="rw" type="button">✕</button></div>

    <div class="rw-list" id="rwList"></div>

    <div class="rw-form">
      <div class="segs" id="rwTypes"></div>

      <div class="car-row" id="rwCarRow" hidden>
        <button class="car-pick" id="rwCarBtn" type="button">
          <span class="txt">选择车辆</span><span class="caret">▼</span>
        </button>
      </div>

      <div class="rw-add-row">
        <input class="qty" id="rwQty" type="number" inputmode="numeric" min="1" step="1" placeholder="数量">
        <button class="primary-sm add" id="rwAdd" type="button">添加</button>
      </div>
    </div>

    <div class="panel-actions">
      <button class="ghost" data-close="rw" type="button">完成</button>
    </div>
  </div>
</div>

<!-- 条件数选择 -->
<div class="modal" id="numModal" hidden>
  <div class="modal-mask" data-close="num"></div>
  <div class="modal-card">
    <div class="modal-head">
      <b id="numTitle">选择条件数</b>
      <button class="x" data-close="num" type="button">✕</button>
    </div>
    <div class="num-list" id="numList"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<!-- 导出 -->
<div class="sheet" id="expSheet" hidden>
  <div class="mask" data-close="exp"></div>
  <div class="panel">
    <div class="panel-head"><b>导出数据</b><button class="x" data-close="exp" type="button">✕</button></div>
    <div class="sh-body2">
      <p class="exp-tip" id="expTip"></p>
      <textarea class="exp-text" id="expText" readonly spellcheck="false"></textarea>
    </div>
    <div class="panel-actions">
      <button class="ghost" data-close="exp" type="button">关闭</button>
      <button class="ghost" id="expCopy" type="button">复制全文</button>
      <button class="primary-sm" id="expDl" type="button">下载文件</button>
    </div>
  </div>
</div>

<script src="cars.js"></script>
<script src="manage.js"></script>
</body>
</html>
