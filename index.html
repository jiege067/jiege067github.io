<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>狂野飙车9 · 助手</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>

<main id="stage">
  <iframe id="f-cars" data-tab="cars" src="cars.html" title="全车图鉴" loading="eager"></iframe>
  <iframe id="f-event" data-tab="event" data-src="event.html" title="特赛计算器"></iframe>
  <iframe id="f-arena" data-tab="arena" data-src="arena.html" title="擂台养成计算器"></iframe>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tab on" type="button" data-tab="cars">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="7" height="7" rx="1.6"/><rect x="14" y="4" width="7" height="7" rx="1.6"/>
      <rect x="3" y="14" width="7" height="6" rx="1.6"/><rect x="14" y="14" width="7" height="6" rx="1.6"/>
    </svg>
    <span>图鉴</span>
  </button>

  <button class="tab" type="button" data-tab="event">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4h10v4a5 5 0 0 1-10 0z"/>
      <path d="M7 5H4.5v1.5A3.5 3.5 0 0 0 8 10M17 5h2.5v1.5A3.5 3.5 0 0 1 16 10"/>
      <path d="M12 13v4M9 20h6M10 20l.5-3h3l.5 3"/>
    </svg>
    <span>特赛</span>
  </button>

  <button class="tab" type="button" data-tab="arena">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 20h18"/>
      <path d="M6 20v-6M12 20V7M18 20v-9"/>
    </svg>
    <span>擂台</span>
  </button>
</nav>

<script src="shell.js"></script>
</body>
</html>
